# Sync server for costmanager — a plain WebDAV directory, NOT a backend API.
#
# Each business's data lives as one static JSON file written/read with PUT/GET,
# served from the SAME site/origin as the PWA itself:
#   PUT/GET  https://your-domain/sync/{businessId}.json
#   PUT/GET  https://your-domain/sync/codes/{code}.json   (short-lived sync codes)
#
# There is no application server on the other end — Nginx's WebDAV module
# (ngx_http_dav_module) handles file writes directly to disk under
# /var/www/costmanager/sync/, alongside the app's own dist/ and index.html.
#
# ---------------------------------------------------------------------------
# Setup (Debian/Ubuntu)
# ---------------------------------------------------------------------------
#   sudo apt install nginx-extras -y   # the WebDAV module isn't in plain `nginx`/`nginx-light`
#   sudo mkdir -p /var/www/costmanager/sync/codes
#   sudo chown -R www-data:www-data /var/www/costmanager/sync
#   sudo chmod -R 750 /var/www/costmanager/sync
#
# Then add this location block inside the existing `server { ... }` block
# that already serves the costmanager PWA, and reload Nginx:
#   sudo nginx -t && sudo systemctl reload nginx
# ---------------------------------------------------------------------------

location /sync/ {
    root /var/www/costmanager;

    # Allow devices to write/read their business's JSON file. GET/HEAD are
    # already implicit for static files; only PUT needs the DAV module.
    dav_methods PUT;
    create_full_put_path on;
    dav_access user:rw group:rw all:r;

    # fetch() always sends Content-Type: application/json, and PUT is never a
    # CORS "simple method" — the browser sends a real OPTIONS preflight before
    # every single PUT, even when the PWA and this location are same-origin
    # (e.g. the app is reached via a domain name while this server only
    # answers on its bare IP, or via http vs https). Nothing in ngx_http_dav_module
    # answers OPTIONS, so without this block every preflight gets nginx's
    # default 405 and the PUT never leaves the browser — this is the actual
    # cause of "PUT to /sync/ returns error". Always send these headers; they
    # are a no-op for genuine same-origin requests.
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods 'GET, PUT, OPTIONS' always;
    add_header Access-Control-Allow-Headers 'Content-Type' always;
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, PUT, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'Content-Type' always;
        add_header Content-Length 0;
        return 204;
    }

    # Devices write/read JSON only; cap a single business export's size.
    client_max_body_size 20m;

    # Directory listing must stay off — these are data files, not a browsable index.
    autoindex off;
}
