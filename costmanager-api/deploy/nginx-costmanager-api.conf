# Reverse proxy block for costmanager-api.
# Include this inside the existing server {} block for 91.107.249.240
# in /etc/nginx/sites-available/costmanager (the one that already serves the PWA).
#
# Example:
#   server {
#       listen 80;
#       server_name 91.107.249.240;
#
#       # ... existing PWA static-file location ...
#
#       include /etc/nginx/snippets/costmanager-api.conf;
#   }

location /api/ {
    proxy_pass http://127.0.0.1:3001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 60s;
    client_max_body_size 10m;
}
